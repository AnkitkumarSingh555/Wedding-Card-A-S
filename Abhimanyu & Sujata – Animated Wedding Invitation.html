<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abhimanyu &amp; Sujata – Wedding Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1410;--ink:#5a1420;--gold:#b8872f}
@media (prefers-color-scheme: dark){:root{--bg:#0d0a08}}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);overflow:hidden;font-family:'Cormorant Garamond',Georgia,serif}
body{display:flex;align-items:center;justify-content:center;perspective:1400px}
#stage{position:relative;height:min(100vh,calc(100vw*16/9));aspect-ratio:9/16;overflow:hidden;border-radius:14px;box-shadow:0 30px 80px #000a;transform-style:preserve-3d}
.slide{position:absolute;inset:0;opacity:0;transform:translateY(100%) rotateX(-25deg) scale(.9);transform-origin:top center;transition:transform 1.4s cubic-bezier(.7,0,.2,1),opacity 1.4s;overflow:hidden}
.slide.on{opacity:1;transform:none;z-index:2}
.slide.out{opacity:0;transform:translateY(-100%) rotateX(25deg) scale(.9);transform-origin:bottom center}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.02)}
.slide.on .bg{animation:kb 7s ease-out forwards}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.12) translateY(-1.5%)}}
#w{background:linear-gradient(#fbf5e3,#f6ecd0)}
#w .top{position:absolute;top:0;left:0;width:100%}
#w .frame{position:absolute;inset:2.5%;border:2px solid var(--gold);outline:1px solid var(--gold);outline-offset:4px;pointer-events:none}
#w .txt{position:absolute;top:21%;left:0;right:0;text-align:center;color:#222;padding:0 8%}
#w .sm{font-size:clamp(9px,2.1vh,16px);letter-spacing:.12em;font-weight:600}
#w .big{font-family:'Great Vibes';color:var(--ink);font-size:clamp(30px,7.6vh,62px);line-height:1.05;margin:.6vh 0}
#w .mid{font-size:clamp(11px,2.5vh,20px);font-weight:600}
#w .names{font-family:'Great Vibes';color:var(--ink);font-size:clamp(26px,6vh,50px);margin:1vh 0;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);padding:.4vh 0}
#w .row{display:flex;justify-content:center;gap:6%;font-size:clamp(11px,2.6vh,21px);font-weight:600;margin-top:1.4vh}
#w .row div{padding:0 4%}#w .row div+div{border-left:1px solid var(--gold)}
#w .place{margin-top:1.4vh;font-size:clamp(11px,2.6vh,21px);font-weight:600;line-height:1.2}
#w .rsvp{position:absolute;bottom:3.6%;width:100%;text-align:center;font-size:clamp(10px,2.1vh,16px);letter-spacing:.14em;font-weight:600;z-index:3}
#w .couple{position:absolute;bottom:7%;right:3%;width:80%}
.mask{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,transparent 55%,#0006)}
#fx{position:absolute;inset:0;z-index:5;pointer-events:none}
#ui{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:0;right:0;display:flex;gap:8px;justify-content:center;z-index:9;flex-wrap:wrap}
button,label.b{background:#b8872f;color:#fff;border:0;border-radius:20px;padding:8px 16px;font:600 14px system-ui,sans-serif;cursor:pointer}
#dots{position:absolute;right:8px;top:50%;transform:translateY(-50%);z-index:6;display:flex;flex-direction:column;gap:6px}
#dots i{width:7px;height:7px;border-radius:50%;background:#b8872f66}#dots i.a{background:#b8872f;box-shadow:0 0 6px #b8872f}
</style></head><body>

<script>
const sl=[...document.querySelectorAll('.slide')],dots=[...document.querySelectorAll('#dots i')];
let cur=0,timer=null,playing=false;
function go(n){const p=sl[cur];p.classList.remove('on');p.classList.add('out');setTimeout(()=>p.classList.remove('out'),1500);
 cur=n;const s=sl[cur];s.classList.remove('out');void s.offsetWidth;s.classList.add('on');dots.forEach((d,i)=>d.classList.toggle('a',i==cur));}
function tick(){go((cur+1)%3)}
const au=document.getElementById('au'),pb=document.getElementById('pb');
pb.onclick=()=>{playing=!playing;if(playing){timer=setInterval(tick,6500);pb.textContent='❚❚ Pause';if(au.src)au.play().catch(()=>{})}else{clearInterval(timer);pb.textContent='▶ Play with music';au.pause()}};
document.getElementById('af').onchange=e=>{const f=e.target.files[0];if(!f)return;au.src=URL.createObjectURL(f);if(playing)au.play().catch(()=>{});};
document.getElementById('stage').onclick=()=>{go((cur+1)%3)};
const cv=document.getElementById('fx'),x=cv.getContext('2d');let P=[];
function rs(){cv.width=cv.offsetWidth;cv.height=cv.offsetHeight}rs();addEventListener('resize',rs);
for(let i=0;i<34;i++)P.push({x:Math.random(),y:Math.random(),r:2+Math.random()*4,v:.0006+Math.random()*.0012,s:Math.random()*6,g:i%3==0});
(function a(){x.clearRect(0,0,cv.width,cv.height);for(const p of P){p.y+=p.v;p.s+=.02;if(p.y>1.05){p.y=-.05;p.x=Math.random()}
 const px=(p.x+Math.sin(p.s)*.03)*cv.width,py=p.y*cv.height;x.beginPath();
